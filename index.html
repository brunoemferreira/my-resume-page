<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Security Headers (OWASP Client-Side Hardening) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data:;" />

    <title>Bruno Ferreira · Arquiteto de Software & Chatbot Specialist</title>
    <meta name="description" content="Landing page de Bruno Ferreira (BF). Desenvolvedor com 18+ anos de experiência, especialista na plataforma Blip para automação conversacional financeira e crédito (FGTS e consignado)." />
    <meta name="author" content="Bruno Ferreira" />
    <meta name="theme-color" content="#070a12" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bruno Ferreira · Arquiteto de Software & Chatbot Specialist" />
    <meta property="og:description" content="18+ anos construindo soluções conversacionais de alta escala com Blip, Clean Architecture, TypeScript, Node.js e .NET." />
    <meta property="og:url" content="https://github.com/brunoemferreira" />

    <!-- Favicon (SVG Monogram BF) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Inline Zero-FOUC Theme Script (Prevents flash of unstyled theme on load) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('bf_theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
